<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoxClips AI</title>
  <style>
    body { background: #0b0d12; color: #f3f4f6; font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; display: flex; justify-content: center; }
    .container { max-width: 750px; width: 100%; }
    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { margin: 0 0 0.4rem; font-size: 1.8rem; }
    header p { color: #9ca3af; margin: 0; font-size: 0.9rem; }
    .card { background: #141821; border: 1px solid #232938; border-radius: 14px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.25rem; }
    .badge { background: #0f1219; border: 1px solid #232938; padding: 0.65rem; border-radius: 8px; }
    .badge span { display: block; font-size: 0.7rem; color: #9ca3af; }
    .badge strong { font-size: 0.85rem; color: #a5b4fc; }
    .upload { border: 2px dashed #232938; border-radius: 12px; padding: 2rem 1rem; text-align: center; cursor: pointer; display: block; }
    input[type="file"] { display: none; }
    .btn { background: #6366f1; color: #fff; border: none; padding: 0.85rem; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 1rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-zip { background: #10b981; display: block; text-align: center; text-decoration: none; margin-bottom: 1rem; }
    .clips { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .clip-card { background: #0f1219; border: 1px solid #232938; border-radius: 10px; padding: 0.75rem; text-align: center; }
    video { width: 100%; border-radius: 8px; background: #000; margin-bottom: 0.5rem; }
    .dl { display: block; padding: 0.5rem; background: #141821; border: 1px solid #232938; color: #fff; border-radius: 6px; text-decoration: none; font-size: 0.85rem; }
    #status { text-align: center; margin-top: 1rem; color: #a5b4fc; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ NoxClips AI</h1>
      <p>30s Viral Clipper • Auto Face Tracking • Animated Captions</p>
    </header>
    <div class="card">
      <div class="grid">
        <div class="badge"><span>Duration</span><strong>30 Seconds</strong></div>
        <div class="badge"><span>AI Style</span><strong>Mixed Hooks</strong></div>
        <div class="badge"><span>Aspect Ratio</span><strong>Auto 9:16</strong></div>
        <div class="badge"><span>Captions</span><strong>Animated</strong></div>
      </div>
      <label class="upload" for="videoInput">
        <div id="fileLabel">📁 Tap to select a video (MP4, MOV)</div>
        <input type="file" id="videoInput" accept="video/*" />
      </label>
      <button class="btn" id="generateBtn" disabled>Generate 30s Clips</button>
      <div id="status"></div>
    </div>
    <div id="results" style="display:none;">
      <a id="zipBtn" class="btn btn-zip" href="#" download>📦 Download All Clips (ZIP)</a>
      <div class="clips" id="clipsGrid"></div>
    </div>
  </div>
  <script>
    const input = document.getElementById('videoInput'), label = document.getElementById('fileLabel'), btn = document.getElementById('generateBtn'), status = document.getElementById('status'), results = document.getElementById('results'), grid = document.getElementById('clipsGrid'), zipBtn = document.getElementById('zipBtn');
    input.addEventListener('change', () => { if (input.files.length) { label.textContent = 'Selected: ' + input.files.name; btn.disabled = false; } });
    btn.addEventListener('click', async () => {
      const file = input.files; if (!file) return;
      btn.disabled = true; results.style.display = 'none'; status.textContent = '⏳ Processing video (1–2 mins)...';
      const fd = new FormData(); fd.append('file', file); fd.append('aspect_ratio', 'auto'); fd.append('ai_style', 'mixed');
      try {
        const res = await fetch('/api/process', { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        grid.innerHTML = '';
        data.clips.forEach((url, i) => {
          grid.innerHTML += `<div class="clip-card"><video src="${url}" controls></video><a class="dl" href="${url}" download="clip_${i+1}.mp4">⬇️ Download Clip ${i+1}</a></div>`;
        });
        zipBtn.href = data.zip_url; results.style.display = 'block'; status.textContent = '✅ Clips ready!';
      } catch (e) { status.textContent = '❌ Error: ' + e.message; } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
